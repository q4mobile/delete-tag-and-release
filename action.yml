name: Delete tag and release
description: delete tag and release
author: "dev-drprasad"

branding:
  color: "red"
  icon: "delete"

inputs:
  branch_name:
    description: branch name
    required: true
  delete_release:
    description: whether to delete release or not
    required: false
    default: true
  repo:
    description: target repository as <owner>/<repository>
    required: false
  branch_name_override:
    description: branch name to use instead of branch_name
    required: false

runs:
  using: "composite"
  steps:
    - name: checkout
      uses: actions/checkout@v4
    - name: cleanup
      shell: bash
      env:
        BRANCH_NAME: ${{ inputs.branch_name }}
        BRANCH_NAME_OVERRIDE: ${{ inputs.branch_name_override }}
      run: |
        git_branch=${BRANCH_NAME_OVERRIDE:-$BRANCH_NAME}
        tag_format=${git_branch//[^a-zA-Z0-9]/-}
        echo "branch_name=[${BRANCH_NAME}]"
        echo "branch_name_override=[${BRANCH_NAME_OVERRIDE}]"
        echo "tag_format=[${tag_format}]"
        git fetch --all --tags
        #search patten vX.X.X-branchName-x
        declare -a tags=( $( git tag --list "v[0-9]*.[0-9]*.[0-9]*-${tag_format}.[0-9]*") )
        failed=0
        for tag_name in "${tags[@]}"
        do
          node "${{ github.action_path }}/index.js" "${tag_name}" || failed=1
          # Delete via the API with GH_TOKEN; git push would use the caller's read-only GITHUB_TOKEN.
          if curl -sSf -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag_name}" >/dev/null; then
            echo "🗑  deleted tag ${tag_name}"
          else
            echo "🌶  failed to delete tag ${tag_name}"
            failed=1
          fi
        done
        exit $failed